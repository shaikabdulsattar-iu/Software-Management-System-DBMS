<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Software Management System</title>
<style>
:root{--bg:#f4f7fb;--white:#fff;--nav:#08111f;--nav2:#14233d;--text:#162033;--muted:#718096;--line:#e5eaf1;--blue:#2563eb;--green:#16a34a;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;--shadow:0 14px 40px #0f172a12}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 10%,#dbeafe 0,transparent 32%),radial-gradient(circle at 90% 90%,#e0e7ff 0,transparent 32%),#f8fafc}.login-card{width:min(460px,92vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 30px 80px #0f172a18}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.login h1{margin:18px 0 6px;font-size:28px}.muted{color:var(--muted)}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;color:#475569}.input,.select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}.input:focus,.select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.full{width:100%;margin-top:8px}.error{color:#b91c1c;background:#fef2f2;border-radius:8px;padding:9px;margin-top:10px;font-size:13px;display:none}.info{background:#eff6ff;color:#1e40af;border-radius:10px;padding:11px;font-size:12px;margin-top:15px}
.app{display:none;min-height:100vh}.sidebar{width:250px;background:var(--nav);color:#fff;position:fixed;inset:0 auto 0 0;padding:20px 14px;z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 25px;font-weight:850}.brand-icon{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#b8c3d6;padding:11px 12px;border-radius:9px;text-align:left;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.main{margin-left:250px;width:calc(100% - 250px)}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:850}.logout{background:none;border:0;color:#64748b}.hamb{display:none;background:none;border:0;font-size:22px}.content{padding:28px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title h1{margin:0;font-size:27px}.subtitle{font-size:14px;color:var(--muted);margin-top:5px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:900;margin:9px 0 4px}.label{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}.donut{width:190px;height:190px;border-radius:50%;margin:15px auto;background:conic-gradient(#2563eb 0 35%,#16a34a 35% 65%,#f59e0b 65% 82%,#dc2626 82%);position:relative}.donut:after{content:"";position:absolute;inset:50px;background:#fff;border-radius:50%}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11px;color:#64748b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.bars{height:230px;display:flex;align-items:end;gap:13px;padding:25px 10px 35px}.bar{flex:1;min-height:14px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#60a5fa,#2563eb);position:relative}.bar b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px}.bar span{position:absolute;bottom:-27px;left:50%;transform:translateX(-50%);font-size:10px;color:#64748b;white-space:nowrap}.table-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f8fafc;text-transform:uppercase;color:#64748b;font-size:10px;letter-spacing:.05em}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}.red{background:#fee2e2;color:#991b1b}.purple{background:#ede9fe;color:#6d28d9}.gray{background:#e2e8f0;color:#475569}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fullfield{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.user-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:80}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:850px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.hamb{display:block}.content{padding:18px}}@media(max-width:550px){.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column;gap:12px}}
</style>
</head>
<body>
<div id="authView" class="login"><div class="login-card">
<div class="logo">◆</div><h1>Software Management System</h1><div id="authSubtitle" class="muted">Secure project delivery workspace</div>
<div id="setupInfo" class="info" style="display:none">First launch detected. Create your own Main Admin account. This account will control Manager and Team Leader access.</div>
<form id="authForm">
<div class="field"><label>Full Name</label><input id="fullName" class="input" autocomplete="name"></div>
<div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email"></div>
<div class="field"><label>Username</label><input id="username" class="input" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="password" class="input" type="password" autocomplete="new-password" required></div>
<div id="confirmWrap" class="field"><label>Confirm Password</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password"></div>
<button id="authButton" class="btn primary full" type="submit">Sign in</button>
<div id="authError" class="error"></div>
</form>
</div></div>

<div id="app" class="app">
<aside id="sidebar" class="sidebar"><div class="brand"><div class="brand-icon">◆</div><div>Software<br>Management</div></div><nav id="nav" class="nav"></nav></aside>
<main class="main"><header class="top"><button class="hamb" onclick="sidebar.classList.toggle('open')">☰</button><b id="pageTitle">Dashboard</b><div class="profile"><div><b id="profileName"></b><div id="profileRole" class="label"></div></div><div id="avatar" class="avatar"></div><button class="logout" onclick="logout()">Logout</button></div></header><section id="content" class="content"></section></main>
</div>
<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>

<script>
const NAV=["Dashboard","Employees","Projects","Teams","Team Members","Sprints","Tasks","Bugs","Reports","About Project"];
const ICONS={Dashboard:"▦",Employees:"♙",Projects:"▣",Teams:"◈","Team Members":"♟",Sprints:"◷",Tasks:"✓",Bugs:"⚠",Reports:"▥","About Project":"ⓘ"};
let me=null, setupMode=false;
let data={employees:[{id:101,first:"Abdul",last:"Sattar",designation:"Project Lead",email:"abdul@example.com",experience:2,salary:65000},{id:102,first:"Naveen",last:"Kumar",designation:"Software Developer",email:"naveen@example.com",experience:1,salary:48000},{id:103,first:"Harsha",last:"Vardhan",designation:"Database Developer",email:"harsha@example.com",experience:2,salary:52000},{id:104,first:"Syam",last:"Kumar",designation:"QA Engineer",email:"syam@example.com",experience:1,salary:45000}],projects:[{id:201,name:"E-Commerce Platform",description:"Scalable online shopping platform",start:"2026-06-01",end:"2026-10-30",status:"In Progress",manager:101},{id:202,name:"Campus Connect",description:"Student collaboration portal",start:"2026-07-10",end:"2026-12-20",status:"Planning",manager:102},{id:203,name:"Healthcare Portal",description:"Appointment management",start:"2026-03-01",end:"2026-08-31",status:"Completed",manager:103}],teams:[{id:301,name:"Core Development",project:201,leader:101},{id:302,name:"Web Experience",project:202,leader:104}],members:[{id:401,team:301,employee:101,joined:"2026-06-01"},{id:402,team:301,employee:102,joined:"2026-06-02"},{id:403,team:302,employee:104,joined:"2026-07-10"}],sprints:[{id:501,name:"Sprint 1 - Foundation",project:201,start:"2026-06-01",end:"2026-06-14",goal:"Architecture and authentication",status:"Completed"},{id:502,name:"Sprint 2 - Catalog",project:201,start:"2026-06-15",end:"2026-06-28",goal:"Product catalog",status:"Completed"},{id:503,name:"Sprint 3 - Checkout",project:201,start:"2026-06-29",end:"2026-07-12",goal:"Checkout workflow",status:"Active"}],tasks:[{id:601,title:"Design authentication flow",sprint:501,employee:101,priority:"High",points:5,status:"Done",due:"2026-06-07"},{id:602,title:"Create product schema",sprint:502,employee:103,priority:"Critical",points:8,status:"Done",due:"2026-06-20"},{id:603,title:"Build product search",sprint:502,employee:102,priority:"High",points:8,status:"Done",due:"2026-06-27"},{id:604,title:"Implement shopping cart",sprint:503,employee:102,priority:"High",points:5,status:"In Progress",due:"2026-07-07"},{id:605,title:"Checkout validation",sprint:503,employee:104,priority:"Critical",points:8,status:"Todo",due:"2026-07-10"}],bugs:[{id:701,title:"Cart total not refreshing",task:604,reported:104,assigned:102,severity:"High",status:"Open",reportedDate:"2026-07-03"},{id:702,title:"Product image broken",task:603,reported:104,assigned:102,severity:"Medium",status:"Resolved",reportedDate:"2026-06-25"},{id:703,title:"Checkout validation bypass",task:605,reported:104,assigned:104,severity:"Critical",status:"In Progress",reportedDate:"2026-07-04"}]};
const saved=localStorage.getItem("sms_demo_data");if(saved)try{data=JSON.parse(saved)}catch{}
const save=()=>localStorage.setItem("sms_demo_data",JSON.stringify(data));
const $=id=>document.getElementById(id);
const emp=id=>data.employees.find(x=>x.id==id)||{}, proj=id=>data.projects.find(x=>x.id==id)||{}, team=id=>data.teams.find(x=>x.id==id)||{}, sprint=id=>data.sprints.find(x=>x.id==id)||{}, task=id=>data.tasks.find(x=>x.id==id)||{};
const nm=e=>e.first?`${e.first} ${e.last}`:"—";
function toastMsg(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function badge(v){let c=["Completed","Done","Resolved","Closed"].includes(v)?"green":["In Progress","Active","High"].includes(v)?"orange":["Critical","Open"].includes(v)?"red":["Planning","Planned","Medium"].includes(v)?"blue":"gray";return `<span class="badge ${c}">${v}</span>`}
async function checkSetup(){try{const r=await fetch("/api/setup/status");const d=await r.json();if(!r.ok)throw Error(d.error);setupMode=d.setupRequired;showAuth()}catch(e){$("authError").textContent=e.message;$("authError").style.display="block";showLogin(false)}}
function showAuth(){if(setupMode){$("authSubtitle").textContent="Create your own Main Admin account";$("setupInfo").style.display="block";$("fullName").parentElement.style.display="block";$("email").parentElement.style.display="block";$("confirmWrap").style.display="block";$("fullName").required=true;$("email").required=true;$("confirmPassword").required=true;$("authButton").textContent="Create Main Admin"}else{showLogin(true)}}
function showLogin(clear){setupMode=false;$("authSubtitle").textContent="Secure project delivery workspace";$("setupInfo").style.display="none";$("fullName").parentElement.style.display="none";$("email").parentElement.style.display="none";$("confirmWrap").style.display="none";$("fullName").required=false;$("email").required=false;$("confirmPassword").required=false;$("authButton").textContent="Sign in";if(clear)$("authError").style.display="none"}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("authError").style.display="none";try{let url=setupMode?"/api/setup/admin":"/api/login";let body=setupMode?{fullName:$("fullName").value,email:$("email").value,username:$("username").value,password:$("password").value}:{username:$("username").value,password:$("password").value};if(setupMode&&$("password").value!==$("confirmPassword").value)throw Error("Passwords do not match.");let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);if(setupMode){alert("Main Admin created. Please sign in with your new account.");showLogin(true);$("fullName").value="";$("email").value="";$("username").value="";$("password").value="";$("confirmPassword").value=""}else{me=d.user;startApp()}}catch(e){$("authError").textContent=e.message;$("authError").style.display="block"}});
async function boot(){try{let r=await fetch("/api/me"),d=await r.json();if(d.user){me=d.user;startApp();return}}catch{}checkSetup()}boot();
function startApp(){$("authView").style.display="none";$("app").style.display="flex";$("profileName").textContent=me.fullName;$("profileRole").textContent=me.role==="ADMIN"?"Main Admin":me.role==="MANAGER"?"Manager":"Team Leader";$("avatar").textContent=me.fullName.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();navRender("Dashboard");render("Dashboard")}
function navRender(active){$("nav").innerHTML=NAV.map(x=>`<button class="${x===active?"active":""}" onclick="navigate('${x}')"><span>${ICONS[x]}</span>${x}</button>`).join("");if(me.role==="ADMIN")$("nav").innerHTML+=`<button class="${active==="User Access"?"active":""}" onclick="userAccess()"><span>♙</span>User Access</button>`}
function navigate(p){navRender(p);$("pageTitle").textContent=p;render(p);$("sidebar").classList.remove("open")}
function render(p){({Dashboard,Employees,Projects,Teams,"Team Members":Members,Sprints,Tasks,Bugs,Reports,About}[p]||Dashboard)()}
function shell(t,s,b=""){$("content").innerHTML=`<div class="title"><div><h1>${t}</h1><div class="subtitle">${s}</div></div>${b}</div>`}
function Dashboard(){shell("Operations Dashboard","Secure command center for software delivery");$("content").innerHTML+=`<div class="cards">${[["Employees",data.employees.length],["Projects",data.projects.length],["Teams",data.teams.length],["Sprints",data.sprints.length],["Tasks",data.tasks.length],["Open Bugs",data.bugs.filter(x=>x.status==="Open").length]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div><div class="label">Live demo data</div></div>`).join("")}</div><div class="grid2"><div class="card"><h3>Projects by Status</h3><div class="donut"></div><div class="legend">${["Planning","In Progress","Completed","On Hold"].map((x,i)=>`<span><i class="dot" style="background:${["#2563eb","#16a34a","#f59e0b","#dc2626"][i]}"></i>${x} (${data.projects.filter(p=>p.status===x).length})</span>`).join("")}</div></div><div class="card"><h3>Tasks by Status</h3>${bars(["Todo","In Progress","Done"],"status","tasks")}</div><div class="card"><h3>Bugs by Severity</h3>${bars(["Low","Medium","High","Critical"],"severity","bugs")}</div><div class="card"><h3>Employees by Designation</h3>${bars([...new Set(data.employees.map(e=>e.designation))],"designation","employees")}</div></div>`}
function bars(labels,key,arr){let a=data[arr],max=Math.max(1,...labels.map(x=>a.filter(v=>v[key]===x).length));return `<div class="bars">${labels.map(x=>{let n=a.filter(v=>v[key]===x).length;return `<div class="bar" style="height:${Math.max(14,n/max*170)}px"><b>${n}</b><span>${x}</span></div>`}).join("")}</div>`}
function table(title,sub,heads,rows,btn=""){shell(title,sub,btn);$("content").innerHTML+=`<div class="table-card"><table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}
function Employees(){table("Employees","Manage people and delivery ownership",["ID","Name","Designation","Email","Experience","Salary","Actions"],data.employees.map(x=>`<tr><td>#${x.id}</td><td>${nm(x)}</td><td>${x.designation}</td><td>${x.email}</td><td>${x.experience} yrs</td><td>₹${x.salary.toLocaleString()}</td><td>${me.role==="TEAM_LEAD"?"View only":`<button class="btn secondary" onclick="employeeForm(${x.id})">Edit</button>`}</td></tr>`),me.role==="TEAM_LEAD"?"":`<button class="btn primary" onclick="employeeForm()">+ Add Employee</button>`)}
function Projects(){table("Projects","Plan and deliver business initiatives",["ID","Project","Description","Dates","Status","Manager","Actions"],data.projects.map(x=>`<tr><td>#${x.id}</td><td>${x.name}</td><td>${x.description}</td><td>${x.start}<br>→ ${x.end}</td><td>${badge(x.status)}</td><td>${nm(emp(x.manager))}</td><td><button class="btn secondary" onclick="projectForm(${x.id})">Edit</button></td></tr>`),`<button class="btn primary" onclick="projectForm()">+ Add Project</button>`)}
function Teams(){table("Teams","Organize delivery teams",["Team","Project","Leader","Members","Actions"],data.teams.map(x=>`<tr><td>${x.name}</td><td>${proj(x.project).name}</td><td>${nm(emp(x.leader))}</td><td>${data.members.filter(m=>m.team===x.id).length}</td><td><button class="btn secondary" onclick="teamForm(${x.id})">Edit</button></td></tr>`),`<button class="btn primary" onclick="teamForm()">+ Add Team</button>`)}
function Members(){table("Team Members","Manage team assignments",["Team","Employee","Joined","Actions"],data.members.map(x=>`<tr><td>${team(x.team).name}</td><td>${nm(emp(x.employee))}</td><td>${x.joined}</td><td><button class="btn danger" onclick="removeMember(${x.id})">Remove</button></td></tr>`),`<button class="btn primary" onclick="memberForm()">+ Add Member</button>`)}
function Sprints(){table("Sprints","Plan focused delivery cycles",["Sprint","Project","Dates","Goal","Status","Actions"],data.sprints.map(x=>`<tr><td>${x.name}</td><td>${proj(x.project).name}</td><td>${x.start} → ${x.end}</td><td>${x.goal}</td><td>${badge(x.status)}</td><td><button class="btn secondary" onclick="sprintForm(${x.id})">Edit</button></td></tr>`),`<button class="btn primary" onclick="sprintForm()">+ Add Sprint</button>`)}
function Tasks(){table("Tasks","Track execution, priorities and ownership",["Task","Sprint","Employee","Priority","Points","Status","Due","Actions"],data.tasks.map(x=>`<tr><td>${x.title}</td><td>${sprint(x.sprint).name}</td><td>${nm(emp(x.employee))}</td><td>${badge(x.priority)}</td><td>${x.points}</td><td>${badge(x.status)}</td><td>${x.due}</td><td><button class="btn secondary" onclick="taskForm(${x.id})">Edit</button></td></tr>`),`<button class="btn primary" onclick="taskForm()">+ Add Task</button>`)}
function Bugs(){table("Bugs","Track quality and resolution",["Bug","Task","Assigned","Severity","Status","Reported","Actions"],data.bugs.map(x=>`<tr><td>${x.title}</td><td>${task(x.task).title}</td><td>${nm(emp(x.assigned))}</td><td>${badge(x.severity)}</td><td>${badge(x.status)}</td><td>${x.reportedDate}</td><td><button class="btn secondary" onclick="bugForm(${x.id})">Edit</button></td></tr>`),`<button class="btn primary" onclick="bugForm()">+ Report Bug</button>`)}
function Reports(){shell("Reports","Management insights from project data");$("content").innerHTML+=`<div class="cards">${[["Employees",data.employees.length],["Projects",data.projects.length],["Teams",data.teams.length],["Tasks",data.tasks.length],["Bugs",data.bugs.length],["Completed Projects",data.projects.filter(x=>x.status==="Completed").length]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("")}</div><br><div class="card"><h3>Employee Workload</h3><table class="table"><thead><tr><th>Employee</th><th>Designation</th><th>Tasks</th><th>Done</th></tr></thead><tbody>${data.employees.map(e=>`<tr><td>${nm(e)}</td><td>${e.designation}</td><td>${data.tasks.filter(t=>t.employee===e.id).length}</td><td>${data.tasks.filter(t=>t.employee===e.id&&t.status==="Done").length}</td></tr>`).join("")}</tbody></table></div>`}
function About(){shell("About Project","Professional DBMS project prototype");$("content").innerHTML+=`<div class="card"><h2>Software Management System</h2><p class="muted">Manage Projects. Organize Teams. Track Tasks. Resolve Bugs.</p><p><b>Roles:</b> Main Admin, Manager and Team Leader.</p><p><b>Security:</b> server-side authentication, bcrypt password hashing, HTTP-only sessions and server-side role authorization.</p><p><b>Storage:</b> Local JSON storage works immediately for development. MySQL persistence is supported when DATABASE_URL or DB_* variables are configured.</p></div>`}
function opts(a,v){return a.map(x=>`<option value="${x.value??x}" ${String(x.value??x)===String(v)?"selected":""}>${x.label??x}</option>`).join("")}
function modalForm(title,body,fn){$("modal").innerHTML=`<h2>${title}</h2><div class="formgrid">${body}</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="${fn}">Save</button></div>`;$("modalBg").style.display="flex"}function closeModal(){$("modalBg").style.display="none"}
function employeeForm(id){let x=id?emp(id):{};modalForm(id?"Edit Employee":"Add Employee",`<div class="field"><label>First Name</label><input id="a1" class="input" value="${x.first||""}"></div><div class="field"><label>Last Name</label><input id="a2" class="input" value="${x.last||""}"></div><div class="field"><label>Designation</label><input id="a3" class="input" value="${x.designation||""}"></div><div class="field"><label>Email</label><input id="a4" class="input" value="${x.email||""}"></div><div class="field"><label>Experience</label><input id="a5" type="number" min="0" class="input" value="${x.experience??""}"></div><div class="field"><label>Salary</label><input id="a6" type="number" min="0" class="input" value="${x.salary??""}"></div>`,`saveEmployee(${id||0})`)}
function saveEmployee(id){if(!a1.value||!a2.value||!a4.value.includes("@"))return toastMsg("Enter valid employee details");let x={id:id||Date.now(),first:a1.value,last:a2.value,designation:a3.value,email:a4.value,experience:+a5.value,salary:+a6.value};if(id)data.employees[data.employees.findIndex(e=>e.id===id)]=x;else data.employees.push(x);save();closeModal();Employees()}
function projectForm(id){let x=id?proj(id):{};modalForm(id?"Edit Project":"Add Project",`<div class="field"><label>Name</label><input id="p1" class="input" value="${x.name||""}"></div><div class="field"><label>Status</label><select id="p2" class="select">${opts(["Planning","In Progress","Completed","On Hold"],x.status||"Planning")}</select></div><div class="field fullfield"><label>Description</label><input id="p3" class="input" value="${x.description||""}"></div><div class="field"><label>Start</label><input id="p4" type="date" class="input" value="${x.start||""}"></div><div class="field"><label>End</label><input id="p5" type="date" class="input" value="${x.end||""}"></div>`,`saveProject(${id||0})`)}
function saveProject(id){if(!p1.value||p5.value<p4.value)return toastMsg("Enter valid project dates");let x={id:id||Date.now(),name:p1.value,status:p2.value,description:p3.value,start:p4.value,end:p5.value,manager:101};if(id)data.projects[data.projects.findIndex(e=>e.id===id)]=x;else data.projects.push(x);save();closeModal();Projects()}
function teamForm(id){let x=id?team(id):{};modalForm(id?"Edit Team":"Add Team",`<div class="field"><label>Team Name</label><input id="t1" class="input" value="${x.name||""}"></div><div class="field"><label>Project</label><select id="t2" class="select">${opts(data.projects.map(p=>({value:p.id,label:p.name})),x.project)}</select></div><div class="field"><label>Leader</label><select id="t3" class="select">${opts(data.employees.map(e=>({value:e.id,label:nm(e)})),x.leader)}</select></div>`,`saveTeam(${id||0})`)}
function saveTeam(id){if(!t1.value)return toastMsg("Team name required");let x={id:id||Date.now(),name:t1.value,project:+t2.value,leader:+t3.value};if(id)data.teams[data.teams.findIndex(e=>e.id===id)]=x;else data.teams.push(x);save();closeModal();Teams()}
function memberForm(){modalForm("Add Team Member",`<div class="field"><label>Team</label><select id="m1" class="select">${opts(data.teams.map(t=>({value:t.id,label:t.name})))}</select></div><div class="field"><label>Employee</label><select id="m2" class="select">${opts(data.employees.map(e=>({value:e.id,label:nm(e)})))}</select></div><div class="field"><label>Joined</label><input id="m3" type="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div>`,`saveMember()`)}
function saveMember(){data.members.push({id:Date.now(),team:+m1.value,employee:+m2.value,joined:m3.value});save();closeModal();Members()}
function removeMember(id){data.members=data.members.filter(x=>x.id!==id);save();Members()}
function sprintForm(id){let x=id?sprint(id):{};modalForm(id?"Edit Sprint":"Add Sprint",`<div class="field"><label>Name</label><input id="s1" class="input" value="${x.name||""}"></div><div class="field"><label>Project</label><select id="s2" class="select">${opts(data.projects.map(p=>({value:p.id,label:p.name})),x.project)}</select></div><div class="field"><label>Start</label><input id="s3" type="date" class="input" value="${x.start||""}"></div><div class="field"><label>End</label><input id="s4" type="date" class="input" value="${x.end||""}"></div><div class="field fullfield"><label>Goal</label><input id="s5" class="input" value="${x.goal||""}"></div><div class="field"><label>Status</label><select id="s6" class="select">${opts(["Planned","Active","Completed"],x.status||"Planned")}</select></div>`,`saveSprint(${id||0})`)}
function saveSprint(id){let x={id:id||Date.now(),name:s1.value,project:+s2.value,start:s3.value,end:s4.value,goal:s5.value,status:s6.value};if(id)data.sprints[data.sprints.findIndex(e=>e.id===id)]=x;else data.sprints.push(x);save();closeModal();Sprints()}
function taskForm(id){let x=id?task(id):{};modalForm(id?"Edit Task":"Add Task",`<div class="field fullfield"><label>Title</label><input id="k1" class="input" value="${x.title||""}"></div><div class="field"><label>Sprint</label><select id="k2" class="select">${opts(data.sprints.map(s=>({value:s.id,label:s.name})),x.sprint)}</select></div><div class="field"><label>Employee</label><select id="k3" class="select">${opts(data.employees.map(e=>({value:e.id,label:nm(e)})),x.employee)}</select></div><div class="field"><label>Priority</label><select id="k4" class="select">${opts(["Low","Medium","High","Critical"],x.priority||"Medium")}</select></div><div class="field"><label>Points</label><input id="k5" type="number" min="1" class="input" value="${x.points||3}"></div><div class="field"><label>Status</label><select id="k6" class="select">${opts(["Todo","In Progress","Done"],x.status||"Todo")}</select></div><div class="field"><label>Due</label><input id="k7" type="date" class="input" value="${x.due||""}"></div>`,`saveTask(${id||0})`)}
function saveTask(id){let x={id:id||Date.now(),title:k1.value,sprint:+k2.value,employee:+k3.value,priority:k4.value,points:+k5.value,status:k6.value,due:k7.value};if(id)data.tasks[data.tasks.findIndex(e=>e.id===id)]=x;else data.tasks.push(x);save();closeModal();Tasks()}
function bugForm(id){let x=id?data.bugs.find(b=>b.id===id):{};modalForm(id?"Edit Bug":"Report Bug",`<div class="field fullfield"><label>Bug Title</label><input id="b1" class="input" value="${x.title||""}"></div><div class="field"><label>Task</label><select id="b2" class="select">${opts(data.tasks.map(t=>({value:t.id,label:t.title})),x.task)}</select></div><div class="field"><label>Assigned To</label><select id="b3" class="select">${opts(data.employees.map(e=>({value:e.id,label:nm(e)})),x.assigned)}</select></div><div class="field"><label>Severity</label><select id="b4" class="select">${opts(["Low","Medium","High","Critical"],x.severity||"Medium")}</select></div><div class="field"><label>Status</label><select id="b5" class="select">${opts(["Open","In Progress","Resolved","Closed"],x.status||"Open")}</select></div>`,`saveBug(${id||0})`)}
function saveBug(id){let x={id:id||Date.now(),title:b1.value,task:+b2.value,reported:me.id,assigned:+b3.value,severity:b4.value,status:b5.value,reportedDate:new Date().toISOString().slice(0,10)};if(id)data.bugs[data.bugs.findIndex(e=>e.id===id)]=x;else data.bugs.push(x);save();closeModal();Bugs()}
async function userAccess(){if(me.role!=="ADMIN")return;navRender("User Access");$("pageTitle").textContent="User Access";shell("User Access","Only your Main Admin account can manage Manager and Team Leader access",`<button class="btn primary" onclick="accountForm()">+ Create Account</button>`);$("content").innerHTML+=`<div class="card"><div id="userRows">Loading...</div></div>`;let r=await fetch("/api/users"),users=await r.json();$("userRows").innerHTML=users.map(u=>`<div class="user-row"><div><b>${u.fullName}</b><div class="label">${u.username} · ${u.email} · ${u.role}</div></div>${u.role==="ADMIN"?'<span class="badge purple">Protected Main Admin</span>':`<button class="btn ${u.active?"danger":"success"}" onclick="toggleUser(${u.id},${!u.active})">${u.active?"Disable":"Enable"}</button>`}</div>`).join("")}
function accountForm(){modalForm("Create Manager / Team Leader",`<div class="field"><label>Full Name</label><input id="u1" class="input"></div><div class="field"><label>Email</label><input id="u2" type="email" class="input"></div><div class="field"><label>Username</label><input id="u3" class="input"></div><div class="field"><label>Password (10+ characters)</label><input id="u4" type="password" class="input"></div><div class="field"><label>Role</label><select id="u5" class="select"><option value="MANAGER">Manager</option><option value="TEAM_LEAD">Team Leader</option></select></div>`,`createAccount()`)}
async function createAccount(){let r=await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:u1.value,email:u2.value,username:u3.value,password:u4.value,role:u5.value})}),d=await r.json();if(!r.ok)return toastMsg(d.error);closeModal();toastMsg("Account created securely");userAccess()}
async function toggleUser(id,active){let r=await fetch("/api/users/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({active})}),d=await r.json();if(!r.ok)return toastMsg(d.error);userAccess()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
</script>
</body>
</html>
